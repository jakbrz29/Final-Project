<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MysteryMon</title>
    <link rel="stylesheet" href="style.css">
</head>

<div id="howToPlaySidebar" class="sidebar">
    <button class="close-btn">&times;</button>
    <h2>How 2 Play</h2>
    <p>Click Start to begin.</p>
    <p>A silhouette of a Gen 1 Pokémon appears.</p>
    <p>Choose the correct Pokémon from the 4 buttons.</p>
    <p>Correct answer = +1 score.</p>
</div>


<div id="settingsSidebar" class="sidebar">
    <button class="close-btn">&times;</button>
    <h2>Settings</h2>
    <p>More settings coming soon.</p>
</div>
<body>


    <div class="title-box">
        <div class="top-buttons">
            <button class="how-btn">How 2 Play</button>
            <button class="settings-btn">Settings</button>
    </div>
        <div class="title">
            <div class="logo-title">
            <img src="purepng.com-pokeballpokeballdevicepokemon-ballpokemon-capture-ball-17015278258617bdog.png" alt="Ball">
            <h1>MysteryMon</h1>
            <img src="OIP.webp" alt="chu">
            </div>
            <p>Test Your Pokemon Knowledge!</p>
        </div>
        <div class="score-container">
    <p>Score: <span id="score">0</span></p>
    <p>High Score: <span id="high-score">0</span></p>
        </div>
        <div class="timer">
    <p>Time: <span id="timer">60</span>s</p>
        </div>
    </div>
    <img id="pokemon-image" src="questionmark.png" alt="Pokemon silhouette">
    <p id="result-text"></p>
    <div class="card">
        <button class="multiple-choice"></button>
        <button class="multiple-choice"></button>
        <button class="multiple-choice"></button>
        <button class="multiple-choice"></button>
        
        <div class="button">
        <button id="start-btn">
            Start
        </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
