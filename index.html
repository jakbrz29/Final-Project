<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MysteryMon</title>
    <link rel="stylesheet" href="style.css">
</head>

<div id="howToPlaySidebar" class="sidebar">
    <button class="close-btn">&times;</button>
    <h2>How 2 Play</h2>
    <p>Click Start to begin.</p>
    <p>A silhouette of a Gen 1 Pokémon appears.</p>
    <p>Choose the correct Pokémon from the 4 buttons.</p>
    <p>Correct answer = +1 score.</p>
</div>


<div id="settingsSidebar" class="sidebar">
    <button class="close-btn">&times;</button>
    <h2>Settings</h2>
    <p>More settings coming soon.</p>
</div>
<body>


    <div class="title-box">
        <div class="top-buttons">
            <button class="how-btn">How 2 Play</button>
            <button class="settings-btn">Settings</button>
    </div>


    <div class="container">
        <div class="title-box">
            <div class="title">
                <h1>MysteryMon</h1>
                <p>Test Your Pokemon Knowledge!</p>
            </div>
            <div class="high-score">
                <p>High Score:</p>
            </div>
        </div>
        <div class="card">

            <img src="pokemon" alt="Pokemon Sprite">

            <button class="multiple-choice"></button>
            <button class="multiple-choice"></button>
            <button class="multiple-choice"></button>
            <button class="multiple-choice"></button>

            <button class="start-button">
                Start
            </button>
            <button class="mini-buttons">
                Guess
            </button>
            <button class="mini-buttons">
                Next
            </button>

        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
