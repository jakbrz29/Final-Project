<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MysteryMon</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="top-buttons">
        <button>How 2 Play</button>
        <button>Settings</button>
    </div>


    <div class="container">
        <div class="title-box">
            <div class="title">
                <h1>MysteryMon</h1>
                <p>Test Your Pokemon Knowledge!</p>
            </div>
            <div class="high-score">
                <p>High Score:</p>
            </div>
        </div>
        <div class="card">

            <img src="pokemon" alt="Pokemon Sprite">

            <button class="multiple-choice"></button>
            <button class="multiple-choice"></button>
            <button class="multiple-choice"></button>
            <button class="multiple-choice"></button>

            <button class="start-button">
                Start
            </button>
            <button class="mini-buttons">
                Guess
            </button>
            <button class="mini-buttons">
                Next
            </button>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
